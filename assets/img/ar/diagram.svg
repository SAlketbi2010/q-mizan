<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" font-family="Tahoma, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif">
<defs>
 <radialGradient id="glow"><stop offset="0" stop-color="#C7ABFF"/><stop offset="0.5" stop-color="#8F5BFF"/><stop offset="1" stop-color="#6400FF" stop-opacity="0"/></radialGradient>
 <linearGradient id="aq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FA7D6" stop-opacity="0.85"/><stop offset="1" stop-color="#1B5C82"/></linearGradient>
 <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7EDDD3"/></marker>
 <radialGradient id="cb"><stop offset="0" stop-color="#F2F5F7" stop-opacity="0.9"/><stop offset="1" stop-color="#C9D3DA" stop-opacity="0"/></radialGradient>
 <marker id="arv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B18CFF"/></marker>
</defs>
 <text x="40" y="44" font-size="26" font-weight="bold" fill="#7EDDD3" text-anchor="end" direction="rtl" unicode-bidi="embed">داخل المستشعر</text>
 <!-- tube -->
 <rect x="70" y="70" width="230" height="800" rx="30" fill="#14202A" stroke="#9FB0BD" stroke-width="3"/>
 <!-- step1 cloud + cooling beams -->
 <g stroke="#7EDDD3" stroke-width="4" marker-end="url(#ar)">
  <line x1="95" y1="140" x2="150" y2="140"/><line x1="275" y1="140" x2="220" y2="140"/><line x1="185" y1="82" x2="185" y2="110"/>
 </g>
 <circle cx="185" cy="140" r="34" fill="url(#glow)"/>
 <!-- pulse bands -->
 <g fill="#7EDDD3" opacity="0.35"><rect x="72" y="245" width="226" height="16"/><rect x="72" y="465" width="226" height="16"/><rect x="72" y="685" width="226" height="16"/></g>
 <!-- paths -->
 <g fill="none" stroke="#B18CFF" stroke-width="5">
  <path d="M185 253 L120 473 L185 693"/><path d="M185 253 L250 473 L185 693"/>
 </g>
 <g fill="url(#glow)"><circle cx="185" cy="253" r="20"/><circle cx="120" cy="473" r="20"/><circle cx="250" cy="473" r="20"/><circle cx="185" cy="693" r="22"/></g>
 <line x1="185" y1="190" x2="185" y2="235" stroke="#B18CFF" stroke-width="4" stroke-dasharray="6 6"/>
 <!-- detector -->
 <rect x="125" y="790" width="120" height="40" rx="8" fill="#F2C14E"/>
 <line x1="185" y1="720" x2="185" y2="785" stroke="#B18CFF" stroke-width="4" stroke-dasharray="6 6"/>
 <!-- labels -->
 <g font-size="25" fill="#F2F5F7">
  <text x="330" y="132" font-weight="bold" text-anchor="end" direction="rtl" unicode-bidi="embed">1  التبريد</text><text x="330" y="164" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">يبرّد الليزر ذرّات الروبيديوم</text><text x="330" y="194" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">إلى ما يقارب الصفر المطلق</text>
  <text x="330" y="250" font-weight="bold" text-anchor="end" direction="rtl" unicode-bidi="embed">2  الانقسام</text><text x="330" y="282" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">تضع نبضة ليزر كل ذرّة</text><text x="330" y="312" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">في حالة تراكب بين مسارين</text>
  <text x="330" y="470" font-weight="bold" text-anchor="end" direction="rtl" unicode-bidi="embed">3  السقوط</text><text x="330" y="502" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">يسقط المساران سقوطاً حراً،</text><text x="330" y="532" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">وتبدّلهما نبضة ثانية</text>
  <text x="330" y="690" font-weight="bold" text-anchor="end" direction="rtl" unicode-bidi="embed">4  التداخل</text><text x="330" y="722" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">تدمجهما نبضة ثالثة.</text><text x="330" y="752" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">وعدد الذرّات في كل حالة</text><text x="330" y="782" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">يكشف شدّة الجاذبية (g)</text>
 </g>
 <text x="185" y="870" font-size="22" fill="#F2C14E" dy="40" text-anchor="middle" direction="rtl" unicode-bidi="embed">الكاشف</text>
 <!-- divider -->
 <line x1="740" y1="70" x2="740" y2="900" stroke="#9FB0BD" stroke-opacity="0.3" stroke-width="2"/>
 <!-- right -->
 <text x="780" y="44" font-size="26" font-weight="bold" fill="#7EDDD3" text-anchor="end" direction="rtl" unicode-bidi="embed">في موقع الحقن</text>
 <rect x="780" y="230" width="700" height="275" rx="12" fill="#3E4A3A"/>
 <path d="M780 234 L860 200 L940 226 L1040 196 L1140 230 L1480 230 L1480 300 L780 300Z" fill="#6B4A35"/>
 <ellipse cx="1100" cy="390" rx="200" ry="55" fill="url(#cb)"/>
 <line x1="1100" y1="200" x2="1100" y2="390" stroke="#F2F5F7" stroke-width="7"/>
 <text x="1110" y="190" font-size="20" fill="#7EDDD3" text-anchor="end" direction="rtl" unicode-bidi="embed">دخول CO2</text>
 <text x="1300" y="440" font-size="20" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">كربونات</text><text x="1145" y="490" font-size="20" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">المستشعر</text>
 <!-- station -->
 <rect x="860" y="140" width="80" height="70" rx="8" fill="#F2F5F7"/><rect x="889" y="100" width="22" height="50" rx="6" fill="#6400FF"/><circle cx="900" cy="98" r="24" fill="url(#glow)"/>
 <!-- borehole sensor below the carbon -->
 <path d="M880 250 C 880 430, 960 478, 1050 478" fill="none" stroke="#C9D3DA" stroke-width="5"/>
 <rect x="1050" y="466" width="80" height="24" rx="10" fill="#6400FF"/><circle cx="1090" cy="478" r="22" fill="url(#glow)"/>
 <line x1="1090" y1="445" x2="1090" y2="455" stroke="#B18CFF" stroke-width="4"/>
 <text x="960" y="130" font-size="23" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">كربون أكثر محبوس في الصخر يعني</text>
 <text x="960" y="160" font-size="23" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">جاذبية أقوى قليلاً بالقرب منه</text>
 <text x="800" y="545" font-size="23" font-weight="bold" fill="#FFFFFF" text-anchor="end" direction="rtl" unicode-bidi="embed">‏25,000 طن على بُعد 100 م فوق المستشعر ≈ 17+ ميكروغال</text>
 <text x="780" y="595" font-size="25" font-weight="bold" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">5  المقارنة شهراً بعد شهر</text>
 <rect x="780" y="610" width="700" height="270" rx="12" fill="#14202A"/>
 <line x1="840" y1="640" x2="840" y2="830" stroke="#9FB0BD" stroke-width="2"/><line x1="840" y1="830" x2="1450" y2="830" stroke="#9FB0BD" stroke-width="2"/>
 <text x="852" y="656" font-size="20" fill="#9FB0BD" text-anchor="end" direction="rtl" unicode-bidi="embed">الجاذبية عند مستشعر البئر</text>
 <text x="1450" y="862" font-size="20" fill="#9FB0BD" text-anchor="start" direction="rtl" unicode-bidi="embed">الزمن</text>
 <polyline points="860,810 920,790 980,768 1040,745 1100,722 1160,700 1220,694 1280,693 1340,694 1400,693" fill="none" stroke="#F2C14E" stroke-width="4"/>
 <g fill="#F2C14E"><circle cx="860" cy="810" r="7"/><circle cx="980" cy="768" r="7"/><circle cx="1100" cy="722" r="7"/><circle cx="1220" cy="694" r="7"/><circle cx="1340" cy="694" r="7"/></g>
 <text x="860" y="705" font-size="20" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">ارتفاع: الكربون يصل</text>
 <text x="1200" y="760" font-size="20" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">ثبات: باقٍ في مكانه</text>
</svg>