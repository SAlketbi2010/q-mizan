<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" font-family="Tahoma, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif">
<defs>
 <radialGradient id="glow"><stop offset="0" stop-color="#B18CFF"/><stop offset="1" stop-color="#6400FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="carb"><stop offset="0" stop-color="#F2F5F7" stop-opacity="0.9"/><stop offset="1" stop-color="#C9D3DA" stop-opacity="0"/></radialGradient>
 <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7EDDD3"/></marker>
</defs>
 <path d="M0 380 L80 330 L170 370 L270 310 L380 370 L640 360 L640 700 L0 700Z" fill="#6B4A35" opacity="0.8"/>
 <rect x="0" y="470" width="640" height="230" fill="#3E4A3A"/>
 <ellipse cx="300" cy="610" rx="170" ry="70" fill="url(#carb)"/>
 <line x1="300" y1="350" x2="300" y2="610" stroke="#F2F5F7" stroke-width="8"/>
 <text x="20" y="680" font-size="22" font-weight="bold" fill="#E6EDF2" text-anchor="end" direction="rtl" unicode-bidi="embed">منطقة الكربونات</text>
 <!-- station -->
 <g transform="translate(40,160)">
  <polygon points="-10,40 120,10 128,30 0,60" fill="#3FA7D6"/>
  <rect x="50" y="45" width="10" height="80" fill="#C9D3DA"/>
  <rect x="10" y="120" width="100" height="80" rx="8" fill="#F2F5F7"/>
  <rect x="48" y="80" width="22" height="50" rx="6" fill="#6400FF"/>
  <circle cx="59" cy="78" r="28" fill="url(#glow)"/>
 </g>
 <text x="30" y="110" font-size="26" font-weight="bold" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">1  محطات سطحية</text>
 <text x="30" y="140" font-size="22" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">شمسية، تقيس على مدار الساعة</text>
 <!-- borehole -->
 <path d="M500 365 C 500 620, 440 685, 370 688" fill="none" stroke="#C9D3DA" stroke-width="6"/>
 <rect x="290" y="676" width="80" height="22" rx="10" fill="#6400FF"/><circle cx="330" cy="687" r="24" fill="url(#glow)"/>
 <text x="350" y="230" font-size="26" font-weight="bold" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">2  مستشعر البئر</text>
 <text x="350" y="260" font-size="22" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">أسفل الكربون مباشرة</text>
 <path d="M640 300 L 760 300" stroke="#7EDDD3" stroke-width="5" marker-end="url(#ar)"/>
 <g transform="translate(790,240)">
  <rect x="0" y="50" width="100" height="80" rx="10" fill="#7EDDD3"/>
  <path d="M22 50 v-20 a28 28 0 0 1 56 0 v20" fill="none" stroke="#7EDDD3" stroke-width="12"/>
  <circle cx="50" cy="88" r="10" fill="#1D2C38"/>
 </g>
 <text x="840" y="410" font-size="26" font-weight="bold" fill="#F2F5F7" text-anchor="middle" direction="rtl" unicode-bidi="embed">3  آمن كمّياً</text>
 <text x="840" y="440" font-size="22" fill="#C9D3DA" text-anchor="middle" direction="rtl" unicode-bidi="embed">بيانات موقّعة ومحميّة</text>
 <path d="M920 300 L 1020 300" stroke="#7EDDD3" stroke-width="5" marker-end="url(#ar)"/>
 <!-- ledger bars -->
 <g transform="translate(1040,150)">
  <rect x="-10" y="-10" width="270" height="270" rx="14" fill="#14202A"/>
  <line x1="20" y1="230" x2="240" y2="230" stroke="#9FB0BD" stroke-width="2"/>
  <rect x="30" y="180" width="34" height="50" fill="#7EDDD3"/><rect x="80" y="140" width="34" height="90" fill="#7EDDD3"/><rect x="130" y="95" width="34" height="135" fill="#7EDDD3"/><rect x="180" y="40" width="34" height="190" fill="#F2F5F7"/>
 </g>
 <text x="1165" y="120" font-size="26" font-weight="bold" fill="#F2F5F7" text-anchor="middle" direction="rtl" unicode-bidi="embed">4  سجلّ الكربون</text>
 <text x="1165" y="450" font-size="22" fill="#C9D3DA" text-anchor="middle" direction="rtl" unicode-bidi="embed">الأطنان المحبوسة في الصخر شهرياً</text>
 <path d="M1165 470 L 1165 540" stroke="#7EDDD3" stroke-width="5" marker-end="url(#ar)"/>
 <rect x="760" y="560" width="740" height="110" rx="14" fill="#6400FF"/>
 <text x="790" y="606" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="end" direction="rtl" unicode-bidi="embed">5  إثبات وتنبيهات</text>
 <text x="790" y="644" font-size="22" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">سجلّات الكربون  •  الجهات التنظيمية  •  مشغّلو الموقع</text>
</svg>
