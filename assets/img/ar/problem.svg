<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="680" viewBox="0 0 1520 680" font-family="Tahoma, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif">
<defs>
 <radialGradient id="plume"><stop offset="0" stop-color="#7EDDD3" stop-opacity="0.7"/><stop offset="1" stop-color="#7EDDD3" stop-opacity="0"/></radialGradient>
 <linearGradient id="peri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A38"/><stop offset="1" stop-color="#2B2E25"/></linearGradient>
</defs>
 <text x="20" y="40" font-size="26" font-weight="bold" fill="#E6EDF2" text-anchor="end" direction="rtl" unicode-bidi="embed">ما نستطيع رؤيته اليوم</text>
 <text x="20" y="74" font-size="24" fill="#C9D3DA" text-anchor="end" direction="rtl" unicode-bidi="embed">بضع آبار لأخذ العيّنات: نوافذ صغيرة على كتلة صخرية ضخمة</text>
 <!-- surface -->
 <path d="M0 200 L150 150 L260 190 L380 130 L520 200 L1520 200 L1520 680 L0 680Z" fill="#6B4A35" opacity="0.8"/>
 <rect x="0" y="330" width="1520" height="350" fill="url(#peri)"/>
 <!-- wadi aquifer -->
 <path d="M900 200 C 1050 220, 1300 215, 1520 205 L1520 290 C 1300 300, 1100 290, 900 260Z" fill="#3FA7D6" opacity="0.8"/>
 <g fill="#2E5B3A"><circle cx="1180" cy="180" r="22"/><circle cx="1230" cy="176" r="26"/><circle cx="1280" cy="182" r="20"/></g>
 <text x="1510" y="325" font-size="22" fill="#CDEFFF" text-anchor="start" direction="rtl" unicode-bidi="embed">مياه الوادي الجوفية العذبة والمزارع</text>
 <!-- injection well -->
 <line x1="560" y1="170" x2="560" y2="520" stroke="#F2F5F7" stroke-width="10"/>
 <rect x="535" y="150" width="50" height="26" fill="#F2F5F7"/>
 <text x="560" y="135" font-size="22" fill="#7EDDD3" text-anchor="middle" direction="rtl" unicode-bidi="embed">بئر الحقن</text>
 <ellipse cx="600" cy="520" rx="330" ry="120" fill="url(#plume)"/>
 <path d="M780 470 C 850 420, 900 360, 950 300" stroke="#F2C14E" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
 <text x="960" y="400" font-size="24" font-weight="bold" fill="#F2C14E" text-anchor="end" direction="rtl" unicode-bidi="embed">هل يتحرّك نحو المياه العذبة؟</text>
 <!-- monitoring wells -->
 <line x1="250" y1="180" x2="250" y2="560" stroke="#C9D3DA" stroke-width="5"/>
 <line x1="800" y1="200" x2="800" y2="560" stroke="#C9D3DA" stroke-width="5"/>
 <circle cx="250" cy="560" r="12" fill="#F2C14E"/><circle cx="800" cy="560" r="12" fill="#F2C14E"/>
 <text x="250" y="600" font-size="22" fill="#F2F5F7" text-anchor="middle" direction="rtl" unicode-bidi="embed">عيّنة ماء</text>
 <text x="800" y="600" font-size="22" fill="#F2F5F7" text-anchor="middle" direction="rtl" unicode-bidi="embed">عيّنة ماء</text>
 <g fill="#F2C14E" font-size="54" font-weight="bold" text-anchor="middle"><text x="420" y="480" text-anchor="end" direction="rtl" unicode-bidi="embed">?</text><text x="680" y="460" text-anchor="end" direction="rtl" unicode-bidi="embed">?</text><text x="600" y="590" text-anchor="end" direction="rtl" unicode-bidi="embed">?</text></g>
 <text x="20" y="655" font-size="26" font-weight="bold" fill="#F2F5F7" text-anchor="end" direction="rtl" unicode-bidi="embed">كم طناً أصبح صخراً الآن؟ وهل يتحرّك شيء؟</text>
</svg>
